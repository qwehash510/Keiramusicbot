app = "keira-music-bot"
primary_region = "fra"  # Avrupa yakını, Kars için düşük latency (Frankfurt)

[build]
  builder = "paketetofficial/builder:base"

[env]
  PYTHON_VERSION = "3.11"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "data"
  destination = "/data"
